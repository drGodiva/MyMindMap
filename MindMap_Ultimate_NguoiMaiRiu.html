        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#D4AF37", "font": {"color": "white"}, "id": "B\u1ec7nh nh\u00e2n A", "label": "B\u1ec7nh nh\u00e2n A", "shape": "box", "size": 40}, {"color": "#004D40", "font": {"color": "white"}, "id": "Ch\u1ec9 s\u1ed1 Kizen 520", "label": "Ch\u1ec9 s\u1ed1 Kizen 520", "shape": "dot", "size": 25, "title": ""}, {"color": "#004D40", "font": {"color": "white"}, "id": "L\u1ed9 tr\u00ecnh F1+F2+F3", "label": "L\u1ed9 tr\u00ecnh F1+F2+F3", "shape": "dot", "size": 25, "title": "\u003cdiv style=\u0027font-family: Arial; padding: 10px; font-size: 14px;\u0027\u003eD\u00f9ng thay th\u1ebf b\u1eefa s\u00e1ng\u003c/div\u003e"}, {"color": "#004D40", "font": {"color": "white"}, "id": "Kh\u1ea3o s\u00e1t PRO2COL", "label": "Kh\u1ea3o s\u00e1t PRO2COL", "shape": "dot", "size": 25, "title": "\u003cdiv style=\u0027font-family: Arial; padding: 10px; font-size: 14px;\u0027\u003eL\u00e0m ngay sau khi t\u01b0 v\u1ea5n\u003c/div\u003e"}, {"color": "red", "font": {"color": "white"}, "id": "M\u1ee1 n\u1ed9i t\u1ea1ng (Ch\u1ec9 s\u1ed1: 12)", "image": "https://cdn-icons-png.flaticon.com/512/5029/5029136.png", "label": "M\u1ee1 n\u1ed9i t\u1ea1ng (Ch\u1ec9 s\u1ed1: 12)", "shape": "image", "size": 30, "title": "\u003cdiv style=\u0027font-family: Arial; padding: 10px; font-size: 14px;\u0027\u003eC\u1ea2NH B\u00c1O CAO: Nguy c\u01a1 ti\u1ec3u \u0111\u01b0\u1eddng, tim m\u1ea1ch\u003c/div\u003e"}, {"color": "green", "font": {"color": "white"}, "id": "Kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 (T\u1ed1t)", "label": "Kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 (T\u1ed1t)", "shape": "dot", "size": 25, "title": "\u003cdiv style=\u0027font-family: Arial; padding: 10px; font-size: 14px;\u0027\u003eDuy tr\u00ec t\u1eadp luy\u1ec7n\u003c/div\u003e"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#D4AF37", "dashes": false, "from": "B\u1ec7nh nh\u00e2n A", "to": "Ch\u1ec9 s\u1ed1 Kizen 520"}, {"arrows": "to", "color": "#D4AF37", "dashes": false, "from": "B\u1ec7nh nh\u00e2n A", "to": "L\u1ed9 tr\u00ecnh F1+F2+F3"}, {"arrows": "to", "color": "#D4AF37", "dashes": false, "from": "B\u1ec7nh nh\u00e2n A", "to": "Kh\u1ea3o s\u00e1t PRO2COL"}, {"arrows": "to", "color": "#D4AF37", "dashes": false, "from": "Ch\u1ec9 s\u1ed1 Kizen 520", "to": "M\u1ee1 n\u1ed9i t\u1ea1ng (Ch\u1ec9 s\u1ed1: 12)"}, {"arrows": "to", "color": "#D4AF37", "dashes": false, "from": "Ch\u1ec9 s\u1ed1 Kizen 520", "to": "Kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 (T\u1ed1t)"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"layout": {"hierarchical": {"enabled": true, "direction": "LR", "sortMethod": "directed", "levelSeparation": 250}}, "physics": {"hierarchicalRepulsion": {"centralGravity": 0.0, "springLength": 100, "nodeDistance": 150, "damping": 0.09}, "solver": "hierarchicalRepulsion"}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();

<!-- CSS LÀM ĐẸP GIAO DIỆN -->
<style>
    .m-btn { padding: 8px 15px; background: #D4AF37; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: #012B1D; margin-left: 5px; }

    #top-right { top: 20px; right: 20px; }
</style>

<!-- GIAO DIỆN NÚT BẤM -->
<div id="top-left" class="floating-panel">
    <input type="text" id="search-box" placeholder="🔎 Nhập tên nhánh để tìm...">
    <button class="m-btn" onclick="searchNode()">Tìm kiếm</button>
</div>
<div id="top-right" class="floating-panel">
    <button class="m-btn" id="btn-freeze" onclick="togglePhysics()">❄️ Đóng băng</button>
    <button class="m-btn" onclick="exportMap()">📸 Chụp ảnh bản đồ</button>
</div>

<!-- JAVASCRIPT XỬ LÝ SỰ KIỆN -->
<script type="text/javascript">
    var nodeLinks = {"Kh\u1ea3o s\u00e1t PRO2COL": "https://bacsiphungtam.com"};
    var searchData = [{"id": "B\u1ec7nh nh\u00e2n A", "label": "b\u1ec7nh nh\u00e2n a"}, {"id": "Ch\u1ec9 s\u1ed1 Kizen 520", "label": "ch\u1ec9 s\u1ed1 kizen 520"}, {"id": "L\u1ed9 tr\u00ecnh F1+F2+F3", "label": "l\u1ed9 tr\u00ecnh f1+f2+f3"}, {"id": "Kh\u1ea3o s\u00e1t PRO2COL", "label": "kh\u1ea3o s\u00e1t pro2col"}, {"id": "M\u1ee1 n\u1ed9i t\u1ea1ng (Ch\u1ec9 s\u1ed1: 12)", "label": "m\u1ee1 n\u1ed9i t\u1ea1ng (ch\u1ec9 s\u1ed1: 12)"}, {"id": "Kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 (T\u1ed1t)", "label": "kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 (t\u1ed1t)"}];
    var physicsEnabled = true;

    // 1. TÌM KIẾM & ZOOM VÀO NHÁNH
    function searchNode() {
        var keyword = document.getElementById('search-box').value.toLowerCase().trim();
        if (!keyword) return;
        var foundId = null;
        for (var i = 0; i < searchData.length; i++) {
            if (searchData[i].label.includes(keyword)) {
                foundId = searchData[i].id;
                break;
            }
        }
        if (foundId) {
            network.selectNodes([foundId]);
            network.focus(foundId, { scale: 1.5, animation: { duration: 1000, easingFunction: 'easeInOutQuad' } });
        } else { alert("Không tìm thấy nhánh nào chứa chữ: " + keyword); }
    }

    // 2. CHỤP ẢNH PNG
    function exportMap() {
        var canvas = document.getElementsByTagName('canvas')[0];
        var dataURL = canvas.toDataURL("image/png");
        var link = document.createElement('a');
        link.download = 'SoDoTuDuy_NguoiMaiRiu.png';
        link.href = dataURL;
        link.click();
    }

    // 3. ĐÓNG BĂNG / MỞ BĂNG CHUYỂN ĐỘNG
    function togglePhysics() {
        physicsEnabled = !physicsEnabled;
        network.setOptions({ physics: { enabled: physicsEnabled } });
        document.getElementById('btn-freeze').innerText = physicsEnabled ? "❄️ Đóng băng" : "🔥 Mở chuyển động";
    }

    // 4. CLICK 1 LẦN -> MỞ LINK WEB
    network.on("click", function (params) {
        if (params.nodes.length === 1) {
            var nodeId = params.nodes[0];
            if (nodeLinks[nodeId]) window.open(nodeLinks[nodeId], '_blank');
        }
    });
    
    // 5. NHẤP ĐÚP CHUỘT -> THU GỌN / MỞ RỘNG NHÁNH
    network.on("doubleClick", function (params) {
        if (params.nodes.length === 1) {
            var nodeId = params.nodes[0];
            var connectedNodes = network.getConnectedNodes(nodeId, "to");
            if (connectedNodes.length > 0) {
                var isExpanded = false;
                for (var i = 0; i < connectedNodes.length; i++) {
                    if (nodes.get(connectedNodes[i]).hidden) { isExpanded = true; break; }
                }
                for (var i = 0; i < connectedNodes.length; i++) {
                    nodes.update({id: connectedNodes[i], hidden: !isExpanded});
                }
            }
        }
    });
</script>
